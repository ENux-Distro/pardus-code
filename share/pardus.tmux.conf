# ============================================================================
#  Pardus Code — tmux layout / theme / shortcuts
#  Loaded in isolation via:  tmux -f pardus.tmux.conf ...
#  Requires tmux >= 3.2 (for display-popup, used by Ctrl-F).
# ============================================================================

# --- terminal & behaviour ---------------------------------------------------
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc,alacritty:Tc"
set -g  mouse on
set -g  base-index 0
set -g  escape-time 10
set -g  focus-events on
set -g  history-limit 10000
set -g  status-interval 5
set -g  renumber-windows on
setw -g aggressive-resize on
set -g  set-titles on
set -g  set-titles-string "Pardus Code — #{pane_current_path}"

# ============================================================================
#  Pardus theme  (yellow / black)
# ============================================================================
PARDUS_FG="#f6f1df"
PARDUS_GOLD="#F2C200"
PARDUS_DARK="#0a0a0a"
PARDUS_DIM="#b6a86f"
PARDUS_BORDER="#4d3f21"
PARDUS_INK="#0a0a0a"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style          "bg=${PARDUS_DARK},fg=${PARDUS_FG}"
set -g status-left-length    40
set -g status-right-length   100
set -g status-left  "#[bg=${PARDUS_GOLD},fg=${PARDUS_INK},bold]  PARDUS CODE #[bg=${PARDUS_DARK},fg=${PARDUS_GOLD}]#[default] "
set -g status-right "#[fg=${PARDUS_GOLD},bold]^R#[fg=${PARDUS_DIM}] resize  #[fg=${PARDUS_GOLD},bold]^O#[fg=${PARDUS_DIM}] swap  #[fg=${PARDUS_GOLD},bold]^F#[fg=${PARDUS_DIM}] find  #[fg=${PARDUS_GOLD},bold]^T#[fg=${PARDUS_DIM}] term  #[fg=${PARDUS_BORDER}]│ #[fg=${PARDUS_DIM}]#{pane_current_path} "

set -g pane-border-style          "fg=${PARDUS_BORDER}"
set -g pane-active-border-style   "fg=${PARDUS_GOLD}"
set -g pane-border-status off
set -g message-style              "bg=${PARDUS_GOLD},fg=${PARDUS_INK},bold"
set -g message-command-style      "bg=${PARDUS_GOLD},fg=${PARDUS_INK}"
set -g mode-style                 "bg=${PARDUS_GOLD},fg=${PARDUS_INK}"
setw -g window-status-current-style "fg=${PARDUS_GOLD},bold"
setw -g window-status-style         "fg=${PARDUS_DIM}"

# ============================================================================
#  Shortcuts  (all prefix-less, exactly as documented to the user)
# ============================================================================

# ---- Ctrl-O : swap the two panes (change which side opencode / nano are on) -
bind -n C-o swap-pane -U \; select-pane -t :.+ \; display-message "Pardus Code: panes swapped"

# ---- Ctrl-T : toggle a small full-width terminal across the bottom ----------
# run-shell expands #{window_id}; the helper toggles the terminal pane on/off.
bind -n C-t run-shell "pardus-code-term '#{window_id}'"

# ---- Ctrl-F : fuzzy-find a file and open it in the nano pane ----------------
# Runs the picker inside a centred popup; on selection it loads the file into a
# new nano buffer (see pardus-code-pick + the `multibuffer` rcfile setting).
# (display-popup does not expand #{...} in its command, so the picker discovers
#  its own session from inside the popup — no argument needed here.)
bind -n C-f display-popup -E -w 62% -h 62% "pardus-code-pick"

# ---- Ctrl-R then arrow keys : resize mode ----------------------------------
# Enter a dedicated RESIZE key-table: each arrow resizes and stays in the mode
# so you can keep nudging; Esc / Enter / q leaves it.
bind -n C-r switch-client -T RESIZE \; \
  display-message "Pardus Code: RESIZE — arrows resize, Esc/Enter to exit"

bind -T RESIZE Up    resize-pane -U 3 \; switch-client -T RESIZE
bind -T RESIZE Down  resize-pane -D 3 \; switch-client -T RESIZE
bind -T RESIZE Left  resize-pane -L 5 \; switch-client -T RESIZE
bind -T RESIZE Right resize-pane -R 5 \; switch-client -T RESIZE
bind -T RESIZE Enter  switch-client -T root \; display-message "Pardus Code: resize done"
bind -T RESIZE Escape switch-client -T root \; display-message "Pardus Code: resize done"
bind -T RESIZE q      switch-client -T root \; display-message "Pardus Code: resize done"

# --- keep the classic prefix available for power users (Ctrl-b) -------------
# Nothing removed; the three bindings above simply take priority.
